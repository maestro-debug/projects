<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               viewport-fit=cover,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<meta name="apple-mobile-web-app-title"
      content="Clock Rec">

<meta name="theme-color" content="#0b0f19">

<link rel="apple-touch-icon" href="icon.png">

<title>Clock Recorder</title>

<style>

:root {
    --bg: #0b0f19;
    --panel: #141a29;
    --line: #242c40;

    --text: #e6ebf5;
    --muted: #8a93a8;

    --red: #ff3b30;
    --green: #34c759;

    --st: env(safe-area-inset-top);
    --sb: env(safe-area-inset-bottom);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    height: 100%;

    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        sans-serif;

    -webkit-user-select: none;
    user-select: none;

    overscroll-behavior: none;
}

button {
    font: inherit;
    color: inherit;
    border: none;
    background: none;
    cursor: pointer;
}

/* ================================
   HOME
================================ */

#home {

    min-height: 100%;

    padding:
        calc(var(--st) + 20px)
        20px
        calc(var(--sb) + 24px);

    display: flex;
    flex-direction: column;

    gap: 18px;
}

header h1 {

    margin: 0;

    font-size: 28px;
    font-weight: 700;

    letter-spacing: -.5px;
}

#miniClock {

    margin: 4px 0 0;

    font-variant-numeric: tabular-nums;

    font-size: 15px;

    color: var(--muted);
}

/* ================================
   SEGMENT CONTROLS
================================ */

.seg {

    display: flex;

    background: var(--panel);

    border: 1px solid var(--line);
    border-radius: 12px;

    padding: 4px;
}

.seg button {

    flex: 1;

    padding: 10px;

    border-radius: 9px;

    font-weight: 600;

    font-size: 15px;

    color: var(--muted);
}

.seg button.on {

    background: var(--line);

    color: var(--text);
}

/* ================================
   VIDEO OPTIONS
================================ */

#videoOpts {

    display: none;

    flex-direction: column;

    gap: 16px;

    background: var(--panel);

    border: 1px solid var(--line);

    border-radius: 14px;

    padding: 15px;
}

#videoOpts.show {
    display: flex;
}

.row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 12px;
}

.row label {

    font-size: 15px;

    font-weight: 600;
}

.row .sub {

    display: block;

    font-size: 12px;

    color: var(--muted);

    font-weight: 400;

    margin-top: 3px;
}

.row .seg {

    flex: 0 0 170px;

    background: var(--bg);
}

.row .seg button {

    padding: 8px;

    font-size: 14px;
}


/* ================================
   SWITCH
================================ */

.switch {

    position: relative;

    width: 51px;
    height: 31px;

    flex: 0 0 51px;
}

.switch input {

    opacity: 0;

    width: 0;
    height: 0;
}

.switch span {

    position: absolute;

    inset: 0;

    background: var(--line);

    border-radius: 31px;

    transition: .2s;
}

.switch span::before {

    content: "";

    position: absolute;

    width: 27px;
    height: 27px;

    left: 2px;
    top: 2px;

    background: #fff;

    border-radius: 50%;

    transition: .2s;
}

.switch input:checked + span {

    background: var(--green);
}

.switch input:checked + span::before {

    transform: translateX(20px);
}


/* ================================
   RECORD BUTTON
================================ */

#recWrap {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    padding: 6px 0;
}

#recBtn {

    width: 96px;
    height: 96px;

    border-radius: 50%;

    border: 5px solid var(--text);

    display: grid;

    place-items: center;
}

#recBtn span {

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background: var(--red);

    transition: transform .15s;
}

#recBtn:active span {

    transform: scale(.9);
}

#recWrap small {

    color: var(--muted);
}

#msg {

    color: #ffcc00;

    font-size: 13px;

    text-align: center;

    min-height: 1em;
}


/* ================================
   RECORDING LIST
================================ */

h2 {

    margin: 0;

    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: var(--muted);

    font-weight: 600;
}

#list {

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.item {

    background: var(--panel);

    border: 1px solid var(--line);

    border-radius: 14px;

    padding: 14px;
}

.item .top {

    display: flex;

    justify-content: space-between;

    align-items: baseline;

    gap: 8px;
}

.item .name {

    font-weight: 600;

    font-size: 15px;
}

.item .meta {

    color: var(--muted);

    font-size: 12px;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;
}

.item audio,
.item video {

    width: 100%;

    margin-top: 10px;

    border-radius: 10px;

    background: #000;
}

.item .acts {

    display: flex;

    gap: 8px;

    margin-top: 10px;
}

.item .acts button {

    flex: 1;

    padding: 9px;

    border-radius: 10px;

    background: var(--line);

    font-size: 14px;

    font-weight: 600;
}

.item .acts button.del {

    color: var(--red);
}

.empty {

    color: var(--muted);

    text-align: center;

    padding: 30px 0;

    font-size: 14px;
}


/* ================================
   RECORDING SCREEN
================================ */

#recScreen {

    position: fixed;

    inset: 0;

    display: none;

    flex-direction: column;

    align-items: center;

    justify-content: space-between;

    background:
        radial-gradient(
            circle at 50% 40%,
            #1a2340 0%,
            #0b0f19 70%
        );

    padding:
        calc(var(--st) + 18px)
        20px
        calc(var(--sb) + 28px);

    z-index: 10;
}

#recScreen.show {

    display: flex;
}


/* ================================
   CLOCK ONLY MODE
================================ */

#recScreen.clock-only {

    padding: 0;

    cursor: pointer;
}

/*
Hide absolutely everything except
the analog clock.
*/

#recScreen.clock-only .topbar,
#recScreen.clock-only .ctrls,
#recScreen.clock-only #digital,
#recScreen.clock-only #date,
#recScreen.clock-only #preview {

    display: none !important;
}

#recScreen.clock-only #clockArea {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 0;
}

#recScreen.clock-only #clock {

    width: min(94vw, 94vh);

    height: min(94vw, 94vh);
}


/* ================================
   RECORDING STATUS
================================ */

.topbar {

    width: 100%;

    display: flex;

    justify-content: center;

    position: relative;
}

.status {

    display: flex;

    align-items: center;

    gap: 10px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.1);

    padding: 8px 16px;

    border-radius: 999px;

    font-variant-numeric: tabular-nums;

    font-weight: 600;
}

.camTag {

    font-size: 12px;

    color: var(--muted);

    font-weight: 500;
}

.dot {

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: var(--red);

    animation: blink 1s infinite;
}

.paused .dot {

    animation: none;

    background: #ffcc00;
}

@keyframes blink {

    50% {
        opacity: .25;
    }
}


/* ================================
   CLOCK
================================ */

#clockArea {

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 18px;

    width: 100%;
}

#clock {

    width: min(82vw, 52vh);

    height: min(82vw, 52vh);
}

#digital {

    font-size: clamp(44px,15vw,84px);

    font-weight: 200;

    letter-spacing: -1px;

    font-variant-numeric: tabular-nums;

    line-height: 1;
}

#date {

    color: var(--muted);

    font-size: 16px;

    margin-top: -8px;
}


/* ================================
   CAMERA PREVIEW
================================ */

#preview {

    position: absolute;

    top: calc(var(--st) + 70px);

    right: 16px;

    width: 90px;

    height: 120px;

    object-fit: cover;

    border-radius: 12px;

    border: 2px solid rgba(255,255,255,.2);

    opacity: 0;

    pointer-events: none;

    transition: opacity .2s;
}

#preview.visible {

    opacity: 1;
}

#preview.mirror {

    transform: scaleX(-1);
}


/* ================================
   RECORDING CONTROLS
================================ */

.ctrls {

    display: flex;

    gap: 22px;

    align-items: center;
}

.cbtn {

    width: 62px;
    height: 62px;

    border-radius: 50%;

    background: rgba(255,255,255,.1);

    display: grid;

    place-items: center;

    font-size: 12px;

    font-weight: 600;

    text-align: center;

    line-height: 1.1;
}

.cbtn.hidden {

    visibility: hidden;
}

#stopBtn {

    width: 84px;
    height: 84px;

    border-radius: 50%;

    border: 5px solid var(--text);

    display: grid;

    place-items: center;
}

#stopBtn span {

    width: 34px;
    height: 34px;

    border-radius: 8px;

    background: var(--red);
}

</style>
</head>

<body>


<!-- ===================================
     HOME
=================================== -->

<main id="home">

    <header>

        <h1>Clock Recorder</h1>

        <p id="miniClock">
            --:--:--
        </p>

    <!-- AUDIO / VIDEO -->

    <div class="seg" id="modeSeg">

<!-- ===================================
     RECORDING SCREEN
=================================== -->

<section id="recScreen">


    <!-- Timer -->

    <div class="topbar">

        <div
            class="status"
            id="status">

            <span class="dot"></span>

    </video>

            --:--:--
        </div>

    <div class="ctrls">


        <button
            class="cbtn"
            id="pauseBtn">

            Pause

        </button>


        <button
            id="stopBtn"
            aria-label="Stop">

            <span></span>

        </button>


        <button
            class="cbtn"
            id="dimBtn">

            Dim

        </button>


        <button
            class="cbtn"
            id="pvBtn">

            Show<br>
            Preview

        </button>


    </div>


</section>



<script>

/* =====================================
   STORAGE
===================================== */

const DB = "clockrec";

const STORE = "recs";


const dbp =
    new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB,1);

        request.onupgradeneeded =
            ()=>{

                request.result
                    .createObjectStore(
                        STORE,
                        {keyPath:"id"}
                    );

            };

        request.onsuccess =
            ()=>resolve(request.result);

        request.onerror =
            ()=>reject(request.error);

    });


const tx =
async(mode,fn)=>{

    const db =
        await dbp;

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    STORE,
                    mode
                );

            const store =
                transaction
                    .objectStore(STORE);

            const result =
                fn(store);

            transaction.oncomplete =
                ()=>resolve(
                    result &&
                    result.result
                );

            transaction.onerror =
                ()=>reject(
                    transaction.error
                );

        }
    );

};


const saveRec =
    r=>tx(
        "readwrite",
        s=>s.put(r)
    );


const delRec =
    id=>tx(
        "readwrite",
        s=>s.delete(id)
    );


const allRecs =
    ()=>tx(
        "readonly",
        s=>s.getAll()
    );



/* =====================================
   HELPERS
===================================== */

const $ =
    id=>document.getElementById(id);


const pad =
    n=>String(n)
        .padStart(2,"0");


const fmtDur =
s=>{

    s =
        Math.round(s);

    const h =
        Math.floor(s/3600);

    const m =
        Math.floor(
            s%3600/60
        );

    const x =
        s%60;

    return (
        h ? h + ":" : ""
    ) +
    pad(m) +
    ":" +
    pad(x);

};


const fmtTime =
d=>
    pad(d.getHours()) +
    ":" +
    pad(d.getMinutes()) +
    ":" +
    pad(d.getSeconds());


const msg =
t=>{
    $("msg").textContent =
        t || "";
};



/* =====================================
   SETTINGS
===================================== */

const settings =
Object.assign(

    {

        mode: "audio",

        cam: "user",

        preview: false,

        clockOnly: false

    },

    JSON.parse(
        localStorage.getItem(
            "clockrec-settings"
        ) || "{}"
    )

);


const saveSettings =
()=>{

    localStorage.setItem(

        "clockrec-settings",

        JSON.stringify(
            settings
        )

    );

};



function applySettingsUI(){

    [...$("modeSeg").children]
        .forEach(

            button=>
                button.classList.toggle(
                    "on",
                    button.dataset.mode
                    === settings.mode
                )

        );


    [...$("camSeg").children]
        .forEach(

            button=>
                button.classList.toggle(
                    "on",
                    button.dataset.cam
                    === settings.cam
                )

        );


    $("previewToggle").checked =
        settings.preview;


    $("clockOnlyToggle").checked =
        settings.clockOnly;


    $("videoOpts")
        .classList.toggle(
            "show",
            settings.mode === "video"
        );


    $("recHint").textContent =

        settings.mode === "video"

        ?

        `Tap to record video · ${
            settings.cam === "user"
            ?
            "Front"
            :
            "Back"
        } camera`

        :

        "Tap to start recording";

}



$("modeSeg").onclick =
e=>{

    const button =
        e.target.closest("button");

    if(!button)
        return;

    settings.mode =
        button.dataset.mode;

    saveSettings();

    applySettingsUI();

};



$("camSeg").onclick =
e=>{

    const button =
        e.target.closest("button");

    if(!button)
        return;

    settings.cam =
        button.dataset.cam;

    saveSettings();

    applySettingsUI();

};



$("previewToggle").onchange =
e=>{

    settings.preview =
        e.target.checked;

    saveSettings();

};



$("clockOnlyToggle").onchange =
e=>{

    settings.clockOnly =
        e.target.checked;

    saveSettings();

};



/* =====================================
   CLOCK
===================================== */

const cv =
    $("clock");


const ctx =
    cv.getContext("2d");


function sizeCanvas(){

    const rect =
        cv.getBoundingClientRect();

    const density =
        devicePixelRatio || 1;


    cv.width =
        rect.width * density;


    cv.height =
        rect.height * density;


    ctx.setTransform(
        density,
        0,
        0,
        density,
        0,
        0
    );

}



function drawClock(now){

    const width =
        cv.getBoundingClientRect().width;

    const center =
        width / 2;

    const radius =
        center * 0.94;


    ctx.clearRect(
        0,
        0,
        width,
        width
    );


    /* face */

    ctx.beginPath();

    ctx.arc(
        center,
        center,
        radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,.035)";

    ctx.fill();


    ctx.lineWidth =
        2;

    ctx.strokeStyle =
        "rgba(255,255,255,.18)";

    ctx.stroke();



    /* minute/hour markers */

    for(
        let i=0;
        i<60;
        i++
    ){

        const angle =
            i * Math.PI / 30;

        const big =
            i % 5 === 0;


        ctx.beginPath();

        ctx.lineCap =
            "round";


        ctx.moveTo(

            center +
            Math.sin(angle) *
            (
                radius -
                (
                    big
                    ?
                    radius*.11
                    :
                    radius*.05
                )
            ),

            center -
            Math.cos(angle) *
            (
                radius -
                (
                    big
                    ?
                    radius*.11
                    :
                    radius*.05
                )
            )

        );


        ctx.lineTo(

            center +
            Math.sin(angle) *
            (
                radius -
                radius*.02
            ),

            center -
            Math.cos(angle) *
            (
                radius -
                radius*.02
            )

        );


        ctx.lineWidth =
            big ? 3.5 : 1.2;


        ctx.strokeStyle =
            big
            ?
            "#e6ebf5"
            :
            "rgba(255,255,255,.35)";


        ctx.stroke();

    }



    /* numbers */

    ctx.fillStyle =
        "rgba(230,235,245,.85)";


    ctx.font =
        `300 ${radius*.13}px -apple-system,sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    for(
        let number=1;
        number<=12;
        number++
    ){

        const angle =
            number *
            Math.PI /
            6;


        ctx.fillText(

            number,

            center +
            Math.sin(angle) *
            radius*.74,

            center -
            Math.cos(angle) *
            radius*.74

        );

    }



    const milliseconds =
        now.getMilliseconds();


    const seconds =
        now.getSeconds() +
        milliseconds/1000;


    const minutes =
        now.getMinutes() +
        seconds/60;


    const hours =
        now.getHours()%12 +
        minutes/60;



    function hand(
        angle,
        length,
        width,
        color,
        tail=0
    ){

        ctx.beginPath();

        ctx.lineCap =
            "round";


        ctx.moveTo(

            center -
            Math.sin(angle)*tail,

            center +
            Math.cos(angle)*tail

        );


        ctx.lineTo(

            center +
            Math.sin(angle)*length,

            center -
            Math.cos(angle)*length

        );


        ctx.lineWidth =
            width;


        ctx.strokeStyle =
            color;


        ctx.stroke();

    }


    hand(

        hours*Math.PI/6,

        radius*.5,

        7,

        "#e6ebf5"

    );


    hand(

        minutes*Math.PI/30,

        radius*.75,

        4.5,

        "#e6ebf5"

    );


    hand(

        seconds*Math.PI/30,

        radius*.85,

        1.8,

        "#ff3b30",

        radius*.15

    );


    ctx.beginPath();

    ctx.arc(
        center,
        center,
        6,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#ff3b30";

    ctx.fill();

}



/* =====================================
   CLOCK LOOP
===================================== */

function tick(){

    const now =
        new Date();


    $("miniClock").textContent =

        fmtTime(now) +

        " · " +

        now.toLocaleDateString(

            undefined,

            {

                weekday:"short",

                day:"numeric",

                month:"short"

            }

        );


    if(

        $("recScreen")
        .classList
        .contains("show")

    ){

        drawClock(now);


        $("digital").textContent =
            fmtTime(now);


        $("date").textContent =

            now.toLocaleDateString(

                undefined,

                {

                    weekday:"long",

                    day:"numeric",

                    month:"long",

                    year:"numeric"

                }

            );


        if(
            rec &&
            rec.state === "recording"
        ){

            $("elapsed")
                .textContent =
                fmtDur(
                    elapsed()
                );

        }

    }


    requestAnimationFrame(
        tick
    );

}



addEventListener(

    "resize",

    sizeCanvas

);



/* =====================================
   PREVIEW
===================================== */

function setPreview(on){

    $("preview")
        .classList
        .toggle(
            "visible",
            on
        );


    $("pvBtn").innerHTML =

        on

        ?

        "Hide<br>Preview"

        :

        "Show<br>Preview";

}



$("pvBtn").onclick =
()=>{

    setPreview(

        !$("preview")
        .classList
        .contains("visible")

    );

};



/* =====================================
   CLOCK ONLY RECOVERY
===================================== */

/*
When Clock Only is enabled,
everything disappears.

Tapping anywhere on the clock
returns the recording controls.
*/

$("recScreen")
.addEventListener(

    "click",

    ()=>{

        if(

            $("recScreen")
            .classList
            .contains(
                "clock-only"
            )

        ){

            $("recScreen")
                .classList
                .remove(
                    "clock-only"
                );


            requestAnimationFrame(
                sizeCanvas
            );

        }

    }

);



/* =====================================
   RECORDING
===================================== */

let rec;

let stream;

let chunks = [];

let startT = 0;

let pausedTotal = 0;

let pauseStart = 0;

let wakeLock = null;

let mime = "";

let curMode =
    "audio";



const elapsed =
()=>{

    const current =

        rec &&
        rec.state === "paused"

        ?

        pauseStart

        :

        Date.now();


    return (

        current -
        startT -
        pausedTotal

    ) / 1000;

};



function pickMime(kind){

    const options =

        kind === "audio"

        ?

        [

            "audio/mp4",

            "audio/webm;codecs=opus",

            "audio/webm"

        ]

        :

        [

            "video/mp4",

            "video/webm;codecs=vp9,opus",

            "video/webm"

        ];


    return (

        options.find(

            type=>

                window.MediaRecorder &&

                MediaRecorder
                .isTypeSupported(type)

        )

        || ""

    );

}



/* =====================================
   WAKE LOCK
===================================== */

async function lockScreenOn(){

    try{

        if(
            "wakeLock"
            in navigator
        ){

            wakeLock =

                await navigator
                .wakeLock
                .request(
                    "screen"
                );

        }

    }
    catch(error){

        console.log(
            "Wake lock unavailable",
            error
        );

    }

}



document
.addEventListener(

    "visibilitychange",

    ()=>{

        if(

            document.visibilityState
            === "visible"

            &&

            rec

            &&

            rec.state
            !== "inactive"

        ){

            lockScreenOn();

        }

    }

);



/* =====================================
   CAMERA
===================================== */

async function getStream(){

    if(
        settings.mode
        === "audio"
    ){

        return navigator
            .mediaDevices
            .getUserMedia({

                audio: true

            });

    }


    /*
    60 FPS requested here.
    Safari/iOS may return a lower rate
    if the chosen camera does not expose
    60fps for the selected mode.
    */

    const video = {

        width: {

            ideal: 1280

        },

        height: {

            ideal: 720

        },

        frameRate: {

            ideal: 60,

            max: 60

        }

    };


    try{

        return await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: {

                    ...video,

                    facingMode: {

                        exact:
                            settings.cam

                    }

                }

            });

    }
    catch(error){

        if(
            error.name
            === "NotAllowedError"
        ){

            throw error;

        }


        /*
        Fall back from exact
        camera request.
        */

        return navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: {

                    ...video,

                    facingMode:
                        settings.cam

                }

            });

    }

}



/* =====================================
   START
===================================== */

$("recBtn").onclick =
async()=>{

    msg("");


    if(

        !window.MediaRecorder

        ||

        !navigator.mediaDevices

    ){

        msg(

            "Recording is not supported here. Open the page in Safari."

        );

        return;

    }


    try{

        stream =
            await getStream();

    }
    catch(error){

        msg(

            "Permission denied. Allow Microphone" +

            (
                settings.mode === "video"
                ?
                " & Camera"
                :
                ""
            ) +

            " for this website in iPhone Settings."

        );

        return;

    }


    curMode =
        settings.mode;


    mime =
        pickMime(
            curMode
        );


    rec =
        new MediaRecorder(

            stream,

            mime
            ?
            {
                mimeType: mime
            }
            :
            undefined

        );


    chunks = [];


    rec.ondataavailable =
    event=>{

        if(
            event.data &&
            event.data.size
        ){

            chunks.push(
                event.data
            );

        }

    };


    rec.onstop =
        finish;


    rec.start(
        1000
    );


    startT =
        Date.now();


    pausedTotal =
        0;


    const isVideo =
        curMode === "video";


    if(isVideo){

        $("preview").srcObject =
            stream;


        $("preview")
            .classList
            .toggle(

                "mirror",

                settings.cam
                === "user"

            );


        setPreview(

            settings.preview

            &&

            !settings.clockOnly

        );


        $("camTag")
            .textContent =

            "· " +

            (
                settings.cam
                === "user"
                ?
                "Front"
                :
                "Back"
            );

    }
    else{

        setPreview(false);

        $("camTag")
            .textContent = "";

    }


    $("pvBtn")
        .classList
        .toggle(

            "hidden",

            !isVideo

        );


    $("recScreen")
        .classList
        .add(
            "show"
        );


    /*
    Enable true clock-only mode.
    */

    $("recScreen")
        .classList
        .toggle(

            "clock-only",

            isVideo
            &&
            settings.clockOnly

        );


    $("recScreen")
        .style
        .opacity = 1;


    $("status")
        .classList
        .remove(
            "paused"
        );


    $("pauseBtn")
        .textContent =
        "Pause";


    sizeCanvas();


    lockScreenOn();

};



/* =====================================
   PAUSE
===================================== */

$("pauseBtn").onclick =
()=>{

    if(!rec)
        return;


    if(
        rec.state
        === "recording"
    ){

        rec.pause();


        pauseStart =
            Date.now();


        $("pauseBtn")
            .textContent =
            "Resume";


        $("status")
            .classList
            .add(
                "paused"
            );

    }
    else if(
        rec.state
        === "paused"
    ){

        rec.resume();


        pausedTotal +=

            Date.now() -
            pauseStart;


        $("pauseBtn")
            .textContent =
            "Pause";


        $("status")
            .classList
            .remove(
                "paused"
            );

    }

};



/* =====================================
   DIM
===================================== */

$("dimBtn").onclick =
()=>{

    const screen =
        $("recScreen");


    screen.style.opacity =

        screen.style.opacity
        === "0.35"

        ?

        1

        :

        0.35;

};



/* =====================================
   STOP
===================================== */

$("stopBtn").onclick =
()=>{

    if(

        rec

        &&

        rec.state
        !== "inactive"

    ){

        window._dur =
            elapsed();


        rec.stop();

    }

};



/* =====================================
   FINISH
===================================== */

async function finish(){

    stream
        .getTracks()
        .forEach(

            track=>
                track.stop()

        );


    $("preview")
        .srcObject =
        null;


    setPreview(
        false
    );


    if(wakeLock){

        wakeLock
            .release()
            .catch(()=>{});


        wakeLock =
            null;

    }


    $("recScreen")
        .classList
        .remove(

            "show",

            "clock-only"

        );


    const type =

        rec.mimeType

        ||

        mime

        ||

        (
            curMode === "audio"
            ?
            "audio/mp4"
            :
            "video/mp4"
        );


    const blob =
        new Blob(

            chunks,

            {
                type
            }

        );


    const date =
        new Date();


    const ext =

        type.includes("webm")

        ?

        "webm"

        :

        (
            type.startsWith("audio")
            ?
            "m4a"
            :
            "mp4"
        );


    const recording = {

        id:
            date.getTime(),

        kind:

            type.startsWith("video")
            ?
            "video"
            :
            "audio",

        type,

        ext,

        blob,

        dur:
            window._dur || 0,

        name:

            `${
                type.startsWith("video")
                ?
                "Video"
                :
                "Recording"
            } ${
                date.getFullYear()
            }-${
                pad(
                    date.getMonth()+1
                )
            }-${
                pad(
                    date.getDate()
                )
            } ${
                pad(
                    date.getHours()
                )
            }.${
                pad(
                    date.getMinutes()
                )
            }.${
                pad(
                    date.getSeconds()
                )
            }`

    };


    try{

        await saveRec(
            recording
        );

    }
    catch(error){

        msg(

            "Could not save to device storage."

        );

    }


    render([
        recording
    ]);

}



/* =====================================
   RECORDING LIST
===================================== */

async function render(extra){

    let recordings = [];


    try{

        recordings =
            await allRecs();

    }
    catch(error){

        console.log(error);

    }


    if(extra){

        extra.forEach(

            item=>{

                if(

                    !recordings.find(

                        recording=>
                            recording.id
                            === item.id

                    )

                ){

                    recordings.push(
                        item
                    );

                }

            }

        );

    }


    recordings.sort(

        (a,b)=>
            b.id-a.id

    );


    const list =
        $("list");


    list.innerHTML =
        "";


    if(
        !recordings.length
    ){

        list.innerHTML =

            `<div class="empty">
                No recordings yet
             </div>`;

        return;

    }



    recordings.forEach(

        recording=>{

            const url =

                URL.createObjectURL(
                    recording.blob
                );


            const item =

                document
                .createElement(
                    "div"
                );


            item.className =
                "item";


            item.innerHTML = `

                <div class="top">

                    <div class="name"></div>

                    <div class="meta">

                        ${fmtDur(recording.dur)}

                        ·

                        ${
                            (
                                recording.blob.size
                                /
                                1048576
                            )
                            .toFixed(1)
                        } MB

                    </div>

                </div>


                <${recording.kind}

                    controls

                    playsinline

                    preload="metadata"

                    src="${url}">

                </${recording.kind}>


                <div class="acts">

                    <button class="sh">
                        Share / Save
                    </button>

                    <button class="ren">
                        Rename
                    </button>

                    <button class="del">
                        Delete
                    </button>

                </div>

            `;


            item
                .querySelector(
                    ".name"
                )
                .textContent =
                recording.name;



            /* SHARE */

            item
                .querySelector(
                    ".sh"
                )
                .onclick =
                async()=>{

                    const file =

                        new File(

                            [recording.blob],

                            `${recording.name}.${recording.ext}`,

                            {
                                type:
                                    recording.type
                            }

                        );


                    if(

                        navigator.canShare

                        &&

                        navigator.canShare({

                            files:[file]

                        })

                    ){

                        try{

                            await navigator
                                .share({

                                    files:[file],

                                    title:
                                        recording.name

                                });

                        }
                        catch(error){}

                    }
                    else{

                        const link =

                            document
                            .createElement(
                                "a"
                            );


                        link.href =
                            url;


                        link.download =
                            file.name;


                        link.click();

                    }

                };



            /* RENAME */

            item
                .querySelector(
                    ".ren"
                )
                .onclick =
                async()=>{

                    const name =

                        prompt(

                            "Rename recording",

                            recording.name

                        );


                    if(
                        name &&
                        name.trim()
                    ){

                        recording.name =
                            name.trim();


                        await saveRec(
                            recording
                        );


                        render();

                    }

                };



            /* DELETE */

            item
                .querySelector(
                    ".del"
                )
                .onclick =
                async()=>{

                    if(

                        confirm(

                            "Delete this recording?"

                        )

                    ){

                        await delRec(
                            recording.id
                        );


                        render();

                    }

                };


            list.appendChild(
                item
            );

        }

    );

}



/* =====================================
   START APP
===================================== */

applySettingsUI();

render();

requestAnimationFrame(
    tick
);

</script>
